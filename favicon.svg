<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162D5A"/>
      <stop offset="100%" stop-color="#0B1B3A"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F6BFF"/>
      <stop offset="100%" stop-color="#8FB0FF" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="136" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="20"/>
  
  <!-- Accent Tech Dot -->
  <circle cx="412" cy="116" r="20" fill="#2F6BFF" filter="url(#glow)"/>
  <circle cx="412" cy="116" r="12" fill="#8FB0FF"/>
  
  <!-- SDL Brand Mark -->
  <text x="246" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Unbounded', 'Montserrat', sans-serif" font-weight="900" font-size="196" letter-spacing="-7" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SDL</text>
</svg>
